name: Build und Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring
          coverage: none

      - name: Composer-Konfiguration prüfen
        run: composer validate --no-check-publish

      - name: Abhängigkeiten installieren
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP-Syntax prüfen
        run: |
          find src bin tests -name '*.php' -exec sh -c 'for file do php -l "$file" || exit 1; done' sh {} +
          php -r 'require "vendor/autoload.php"; \Symfony\Component\Yaml\Yaml::parseFile("config.example.yaml");'

      - name: Schnelle Tests ausführen
        run: composer test

      - name: Integrationstests ausführen
        run: sh tests/integration/run.sh

      - name: Produktionsabhängigkeiten vorbereiten
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

